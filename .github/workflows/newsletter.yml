name: Send Daily Newsletter

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      sendId:
        description: "Optional existing newsletter job ID to resume"
        required: false
        type: string

concurrency:
  group: newsletter-automation
  cancel-in-progress: false

jobs:
  run-newsletter:
    name: Execute newsletter pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEWSLETTER_SEND_ID: ${{ github.event.inputs.sendId }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GOOGLE_USER_EMAIL: ${{ secrets.GOOGLE_USER_EMAIL }}
      GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run newsletter automation script
        run: bun run scripts/send-newsletter.ts